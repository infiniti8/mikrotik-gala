- name: firewall_Mediaplayer
  hosts: GALA_MikroTik_MPR
  gather_facts: false
  connection: network_cli
  tasks:
    - name: Addreslist_FIREWALL
      routeros_command:
        commands:
        - /ip firewall address-list add address=94.103.235.250 list=MediaPlayer
        - /ip firewall filter add action=accept chain=forward comment=MediaPlayer dst-address-list=MediaPlayer out-interface-list=WAN place-before=[/ip firewall filter find chain=forward comment="WEB"]
      when: '"192.167." in ansible_ssh_host'  