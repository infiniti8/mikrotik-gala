- name: Change ISP Mark Magle
  hosts: GALA_MikroTik_MPR
  gather_facts: false
  connection: network_cli
  vars:
    ansible_command_timeout: 180
  tasks:
    - name: Change established mangle
      routeros_command:
        commands:
          - /ip firewall mangle set [find action=mark-connection chain=input new-connection-mark=in-c_isp1] protocol=!udp
          - /ip firewall mangle set [find action=mark-connection chain=input new-connection-mark=in-c_isp2] protocol=!udp