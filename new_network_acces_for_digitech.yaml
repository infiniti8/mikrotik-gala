- name: add new network acces from digitech
  hosts: BF
  gather_facts: false
  connection: network_cli
    tasks:
      - name: add adress to list InetAdmin
        routeros_command:
          commands: 
            - :if ([/ip firewall filter get [find action=accept chain=input] src-address-list]="InetAdmin") do={/ip firewall address-list add address=194.190.106.86 list=InetAdmin}
      - name: add adress to list Admin
        routeros_command:
          commands: 
            - :if ([/ip firewall filter get [find action=accept chain=input] src-address-list]="Admin") do={/ip firewall address-list add address=10.24.11.40 list=Admin comment=digitech}
            - /ip firewall address-list remove [find list=Admin address=192.168.51.116]
            - /ip firewall address-list remove [find list=Admin address=home.papa-admin.ru]
            - /ip firewall address-list remove [find list=Admin address=192.168.255.0/24]
            - /ip firewall address-list remove [find list=Admin address=192.168.12.218]
            - /ip firewall address-list remove [find list=Admin address=192.168.2.75]
      - name: add address to ip service
        routeros_command:
          commands: 
            - :if ([/ip service get [find winbox] address]~"192\\.168\\.48\\.0") do={/ip service set winbox address="192.168.48.0/22,195.151.193.165/32,192.168.2.0/24,10.24.11.40/32,194.190.106.86/32"}
