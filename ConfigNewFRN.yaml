- name: firewall
  hosts: DynamicHost
  gather_facts: false
  connection: network_cli
  vars:
    shopname:
    shopcode:
    shopnet:
    vpnpass:
  tasks:
    - name: Set interface name
      routeros_command:
        commands:
          - /interface ethernet
          - set [ find default-name=ether2 ] name=ether2-LAN
          - set [ find default-name=ether3 ] name=ether3-LAN
          - set [ find default-name=ether4 ] name=ether4-LAN
          - set [ find default-name=ether5 ] name=ether5-LAN
    - name: Add Bridge
      routeros_command:
        commands:
          - /interface bridge add name=LAN protocol-mode=rstp
          - /interface bridge port
          - add bridge=LAN interface=ether2-LAN
          - add bridge=LAN interface=ether3-LAN
          - add bridge=LAN interface=ether4-LAN
          - add bridge=LAN interface=ether5-LAN
    - name: Set interface list
      routeros_command:
        commands:
          - /interface list
          - add name=WAN
          - add name=VPN
          - /interface list member add interface=ether1-ISP1 list=WAN
    - name: Set service
      routeros_command:
        commands:
          - /ip service
          - set telnet disabled=yes
          - set ftp disabled=yes
          - set www address=192.166.0.0/16
          - set api disabled=yes
          - set api-ssl disabled=yes
          - set ssh address="192.168.48.0/22,195.151.193.165/32,192.168.12.0/24,192.168.44.0/24,192.168.0.0/24,192.168.2.0/24,192.168.3.0/24,192.168.4.0/24,192.168.43.0/24,162.168.60.0/24"
          - set winbox address="192.168.48.0/22,195.151.193.165/32,192.168.44.0/24,192.168.0.0/24,192.168.2.0/24,192.168.3.0/24,192.168.4.0/24,192.168.43.0/24,162.168.60.0/24,192.166.64.0/24"
    - name: Disable SIP filtering
      routeros_command:
        commands:
          - /ip firewall service-port set sip disabled=yes
    - name: Set SNMP community
      routeros_command:
        commands:
          - /snmp set enabled=yes
          - /snmp community set [ find default=yes ] addresses=192.168.12.0/24,10.193.63.0/24,10.192.63.0/24
    - name: Set over settings
      routeros_command:
        commands:      
          - /ip cloud set update-time=no
          - /system clock set time-zone-autodetect=no
          - /system clock manual set time-zone=+05:00
          - /system ntp client set enabled=yes primary-ntp=192.36.143.130 secondary-ntp=194.190.168.1
          - /system package update set channel=long-term
          - /ip ipsec profile set [ find default=yes ] enc-algorithm=aes-128
          - /ip neighbor discovery-settings set discover-interface-list=!WAN
    - name: Set IP adresses
      routeros_command:
        commands:
          - /ip address
          - add address=("{{shopnet}}".".254/24") interface=LAN
          - add address=("10.90.90.93/24") interface=LAN
    - name: Set DNS adresses
      routeros_command:
        commands:
          - /ip dns static add address=("{{shopnet}}".".1") name=direktor
    - name: Set DHCP options
      routeros_command:
        commands:
          - /ip dhcp-server option add code=43 name=option43 value=0x01040ac13f05
    - name: Set DHCP
      routeros_command:
        commands:          
          - /ip dhcp-server option sets add name=set43 options=option43
          - /ip pool add name=poolwifi  ranges=("{{shopnet}}".".200-"{{shopnet}}.".220")
          - /ip dhcp-server 
          - add address-pool=poolwifi dhcp-option-set=set1 disabled=no interface=LAN name=dhcp1
          - /ip dhcp-server network 
          - add address=("{{shopnet}}".".0/24") gateway=("{{shopnet}}".".254") dns-server=("{{shopnet}}".".254") dhcp-option=option43 dhcp-option-set=set43
    - name: Set VPN
      routeros_command:
        commands:
          - /interface l2tp-client add name=FRN_EK connect-to=195.177.194.8 allow=mschap2 user=("{{shopname}}"."_"."{{shopcode}}") password=({{vpnpass}}) disabled=no
          - /interface list member add interface=FRN_EK list=VPN
          - /interface l2tp-client add name=FRN_MS connect-to=195.162.6.9 allow=mschap2 user=("{{shopname}}"."_"."{{shopcode}}") password=({{vpnpass}})  disabled=no
          - /interface list member add interface=FRN_MS list=VPN
    - name: Set NAT
      routeros_command:
        commands:
          - /ip firewall nat add action=masquerade chain=srcnat out-interface-list=WAN
          - /ip firewall layer7-protocol
          - add name=myway.local regexp=myway.local
          - add name=galamart.ru regexp=galamart.ru
          - add name=cs22.wpc.v0cdn.net regexp=cs22.wpc.v0cdn.net
          - add name=apps.skype.com regexp=apps.skype.com
          - add name=download.skype.com regexp=download.skype.com
          - add name=galacentre.ru regexp=galacentre.ru
          - /ip firewall nat
          - add action=dst-nat chain=dstnat connection-mark=galamart.ru-fwd to-addresses=192.168.49.1
          - add action=dst-nat chain=dstnat connection-mark=cs22.wpc.v0cdn.net-fwd to-addresses=192.168.49.1
          - add action=dst-nat chain=dstnat connection-mark=apps.skype.com-fwd to-addresses=192.168.49.1
          - add action=dst-nat chain=dstnat connection-mark=download.skype.com-fwd to-addresses=192.168.49.1
          - add action=dst-nat chain=dstnat connection-mark=galacentre.ru-fwd to-addresses=192.168.49.1
          - add action=dst-nat chain=dstnat connection-mark=myway.local-fwd to-addresses=192.168.49.1

    - name: Set firewall address-list
      routeros_command:
        commands:
          - /ip firewall address-list 
          - add address=192.168.48.27 list=InetAdmin comment="Suhanov Onegin"
          - add address=192.168.48.2 list=InetAdmin comment="Nikita Onegin"
          - add address=192.168.48.0/22 list=InetAdmin comment="Onegin All"
          - add address=192.168.12.79 list=InetAdmin comment="Server Ansible"
          - add address=10.193.63.7 list=InetAdmin comment="Server Ansible"
          - add address=192.168.255.0/24 list=InetAdmin comment="netadmin"
          - add address=194.190.106.86 list=InetAdmin comment="external LvaTolstogo"
          - add address=195.151.193.165 list=InetAdmin comment="external Onegin"
          - add address=79.172.1.40 list=InetAdmin comment="external Onegin Convex"
          - add address=195.162.6.0/23 list=InetAdmin comment="AS207496 MSK"
          - add address=195.177.194.0/23 list=InetAdmin comment="AS207496 EKB"
          - add address=("{{shopnet}}".".0/24") list=LAN
    - name: Set firewall filter input
      routeros_command:
        commands:
          - /ip firewall filter 
          - add action=accept chain=input comment="Accept input established connections" connection-state=established,related in-interface-list=WAN
          - add action=accept chain=forward comment="Accept established connections" connection-state=established,related
          - add action=drop chain=input comment="Drop input invalid connections" connection-state=invalid disabled=yes in-interface-list=WAN
          - add action=accept chain=input comment="Accept input ICMP" in-interface-list=WAN protocol=icmp
          - add action=accept chain=input comment="WinBox from Internet and LAN" dst-port=8291,22,80 protocol=tcp src-address-list=InetAdmin
          - add action=drop chain=input comment="Drop input all" connection-nat-state=!dstnat disabled=yes in-interface-list=WAN
          - add action=accept chain=forward comment=Ping protocol=icmp
          - add action=accept chain=forward comment=Accept_VPN_OUT out-interface-list=VPN
          - add action=accept chain=forward comment=Accept_VPN_IN in-interface-list=VPN
          - add action=accept chain=forward comment="Internet acces" out-interface-list=WAN src-address-list=LAN
          - add action=drop chain=forward comment="Drop all" connection-nat-state=!dstnat disabled=yes
    - name: Set firewall mangle
      routeros_command:
        commands: 
          - /ip firewall mangle
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=myway.local log=yes new-connection-mark=myway.local-fwd passthrough=yes protocol=udp
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=galacentre.ru new-connection-mark=galacentre.ru-fwd passthrough=yes protocol=udp
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=download.skype.com new-connection-mark=download.skype.com-fwd passthrough=yes protocol=udp
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=apps.skype.com new-connection-mark=apps.skype.com-fwd passthrough=yes protocol=udp
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=download.skype.com new-connection-mark=download.skype.com-fwd passthrough=yes protocol=udp
          - add action=mark-connection chain=prerouting dst-address=192.166.176.254 dst-port=53 layer7-protocol=galamart.ru new-connection-mark=galamart.ru-fwd passthrough=yes protocol=udp
    - name: Set BGP
      routeros_command:
        commands:
          - /routing ospf instance set [ find default=yes ] router-id=("{{shopnet}}".".254")
          - /routing ospf interface
          - add interface=LAN network-type=broadcast passive=yes
          - add authentication=md5 authentication-key=ehjdtym0 interface=FRN_MS network-type=point-to-point
          - add authentication=md5 authentication-key=ehjdtym0 interface=FRN_EK network-type=point-to-point
          - /routing ospf network
          - add area=backbone network=("{{shopnet}}".".0/24")
          - add area=backbone network=10.193.248.0/22
          - add area=backbone network=10.192.248.0/22