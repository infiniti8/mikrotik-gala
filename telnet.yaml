- name: telnet
  hosts: GALA_MikroTik_MPR
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: telnet
      routeros_command:
        commands:
          - /system telnet twitter.com 443
      register: telnet_result

    - name: debug reg var
      debug: var=telnet_result.stdout_lines
