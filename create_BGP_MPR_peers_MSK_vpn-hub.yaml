- name: Create BGP peers on MSK VPN-hub
  hosts: 10.192.7.9
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180
    mpr_code:

  tasks:
    - name: Create BGP peers
      routeros_command:
        commands:
          - /routing bgp peer add in-filter=vpn-bgp-in keepalive-time=30s name=("MPR_"."{{mpr_code}}") out-filter=vpn-bgp-out remote-address=("10.192.242."."{{mpr_code}}) remote-as=65000 route-reflect=yes ttl=default
