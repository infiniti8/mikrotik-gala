- name: Open Promsvyazbank ports on FRN
  hosts: GALA_MikroTik_FRN
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: Open Promsvyazbank ports on FRN
      routeros_command:
        commands:
          - /ip firewall address-list add list="Promsvyazbank" address="91.223.63.46"
          - /ip firewall address-list add list="Promsvyazbank" address="91.223.63.50"
          - /ip firewall address-list add list="Promsvyazbank" address="91.223.63.105"
          - /ip firewall address-list add list="Promsvyazbank" address="193.200.10.119"
          - /ip firewall address-list add list="Promsvyazbank" address="193.200.10.120"
          - :if ([:len [/ip firewall filter find comment="Sberbank"]] = 1) do={/ip firewall filter add chain=forward dst-address-list="Promsvyazbank" action=accept protocol=tcp out-interface-list=WAN comment="Promsvyazbank" place-before=[find comment~"Sberbank"]}
