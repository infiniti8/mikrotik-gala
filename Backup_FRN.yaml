- name: backup
  hosts: GALA_MikroTik_FRN
  gather_facts: false
  connection: network_cli
  vars:
    ansible_command_timeout: 60
    backup_file: "{{ ansible_ssh_host }}.backup"
  tasks:
    - name: export config
      routeros_facts:
        gather_subset: config
    - name: save output
      local_action: copy content={{ ansible_net_config }} dest=/var/lib/awx/projects/mikrotik/FRN/{{ backup_file }}
