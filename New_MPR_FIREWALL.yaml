- name: new_mpr_firewall
  hosts: BF
  gather_facts: false
  connection: network_cli
  vars:
    ansible_command_timeout: 60

  tasks:
    - name: START
      debug:
        msg: "-------START Change ruls new firewall Procedure-------"
#Удаление старых правил firewal
    - name: Delete_ruls_old_firewall
      routeros_command:
        commands: /ip firewall filter remove [find]
#Удаление старых правил firewal
    - name: print list ruls
      routeros_command:
        commands: /ip firewall filter print
      register: filter_print
#test 
    - name: filter print
      debug:
        msg: "filter rules  deleted"
      when: "'Flags: X - disabled, I - invalid, D - dynamic' in filter_print.stdout"