- name: Allow Internet for VLAN20
  hosts: GALA_MikroTik_BF
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180
    octet_3rd: "{{ ansible_ssh_host | regex_search('[0-9]+(?=\\.[0-9]+$)') }}"

  tasks:
      - name: Edit address list Internet
        routeros_command:
        commands:
          - /ip firewall address-list add address=("10.241."."{{ octet_3rd }}".".192/26") list=Internet
