- name: New DNS for FRNs
  hosts: newshop
  gather_facts: false
  connection: network_cli
  vars:
    ansible_command_timeout: 180
  tasks:
    - name: Change DNS client
      routeros_command:
        commands:
          - /ip dhcp-client set [find interface~"ether"] use-peer-dns=no
          - /ip dns set servers=10.193.48.48,10.192.51.4
