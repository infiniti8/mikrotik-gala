- name: firewall
  hosts: newshop
  gather_facts: false
  connection: network_cli
  vars:
    ansible_command_timeout: 180
    shopcode:
    shopnet:
    shopfullname:
  tasks:
    - name: Set interface name
      routeros_command:
        commands:
          - /interface ethernet set [ find default-name=ether1 ] name=ether1-ISP1
          - /interface ethernet set [ find default-name=ether2 ] name=ether2-LAN
          - /interface ethernet set [ find default-name=ether3 ] name=ether3-LAN
          - /interface ethernet set [ find default-name=ether4 ] name=ether4-LAN
          - /interface ethernet set [ find default-name=ether5 ] name=ether5-LAN
    - name: Add Bridge
      routeros_command:
        commands:
          - /interface bridge add name=LAN protocol-mode=rstp
          - /interface bridge port add bridge=LAN interface=ether2-LAN
          - /interface bridge port add bridge=LAN interface=ether3-LAN
          - /interface bridge port add bridge=LAN interface=ether4-LAN
          - /interface bridge port add bridge=LAN interface=ether5-LAN
    - name: Set interface list
      routeros_command:
        commands:
          - /interface list add name=WAN
          - /interface list add name=VPN
          - /interface list member add interface=ether1-ISP1 list=WAN
    - name: Set service
      routeros_command:
        commands:
          - /ip service set telnet disabled=yes
          - /ip service set ftp disabled=yes
          - /ip service set www address=192.166.0.0/16
          - /ip service set api disabled=yes
          - /ip service set api-ssl disabled=yes
          - /ip service set ssh address="192.168.48.0/22,195.151.193.165/32,192.168.12.0/24,192.168.2.0/24,10.193.63.0/24,195.177.194.6/32"
          - /ip service set winbox address="192.168.48.0/22,195.151.193.165/32,192.168.2.0/24,10.193.48.227/32,194.190.106.86/32"
    - name: Disable SIP filtering
      routeros_command:
        commands:
          - /ip firewall service-port set sip disabled=yes
    - name: Set SNMP community
      routeros_command:
        commands:
          - /snmp set enabled=yes
          - /snmp community set [ find default=yes ] addresses=192.168.12.0/24,10.193.63.0/24,10.192.63.0/24
    - name: Set over settings
      routeros_command:
        commands:
          - /ip cloud set update-time=no
          - /system clock set time-zone-autodetect=no
          - /system clock manual set time-zone=+05:00
          - /system ntp client set enabled=yes primary-ntp=192.36.143.130 secondary-ntp=194.190.168.1
          - /system package update set channel=long-term
          - /ip ipsec profile set [ find default=yes ] enc-algorithm=aes-128
          - /ip neighbor discovery-settings set discover-interface-list=!WAN
    - name: Set IP adresses
      routeros_command:
        commands:
          - /ip address add address=("{{shopnet}}".".254/24") interface=LAN
    - name: Set DNS adresses
      routeros_command:
        commands:
          - /ip dns static add address=("{{shopnet}}".".1") name=direktor
          - /ip dns set allow-remote-requests=yes servers=10.193.48.48,10.192.51.41
    - name: Set DHCP options
      routeros_command:
        commands:
          - /ip dhcp-server option add code=43 name=option43 value=0x01040ac13f05
    - name: Set DHCP
      routeros_command:
        commands:
          - /ip dhcp-server option sets add name=set43 options=option43
          - /ip pool add name=poolwifi  ranges=("{{shopnet}}".".200-"."{{shopnet}}".".220")
          - /ip dhcp-server add address-pool=poolwifi dhcp-option-set=set43 disabled=no interface=LAN name=dhcp1
          - /ip dhcp-server network add address=("{{shopnet}}".".0/24") gateway=("{{shopnet}}".".254") dns-server=("{{shopnet}}".".254") dhcp-option=option43 dhcp-option-set=set43
    - name: Set VPN
      routeros_command:
        commands:
          - /interface l2tp-client add name=FRN_EK connect-to=195.177.194.8 allow=mschap2 user=("FRN_"."{{shopcode}}") password=("FRN_"."{{shopcode}}"."FRN_"."{{shopcode}}") disabled=no
          - /interface list member add interface=FRN_EK list=VPN
          - /interface l2tp-client add name=FRN_MS connect-to=195.162.6.9 allow=mschap2 user=("frn"."{{shopcode}}") password=("frn"."{{shopcode}}"."frn"."{{shopcode}}")  disabled=no
          - /interface list member add interface=FRN_MS list=VPN
    - name: Set NAT
      routeros_command:
        commands:
          - /ip firewall nat add action=masquerade chain=srcnat out-interface-list=WAN

    - name: Set firewall address-list
      routeros_command:
        commands:
          - /ip firewall address-list add address=192.168.48.27 list=InetAdmin comment="Suhanov Onegin"
          - /ip firewall address-list add address=192.168.48.2 list=InetAdmin comment="Nikita Onegin"
          - /ip firewall address-list add address=192.168.48.0/22 list=InetAdmin comment="Onegin All"
          - /ip firewall address-list add address=10.193.63.7 list=InetAdmin comment="Server Ansible"
          - /ip firewall address-list add address=194.190.106.86 list=InetAdmin comment="external LvaTolstogo"
          - /ip firewall address-list add address=195.151.193.165 list=InetAdmin comment="external Onegin"
          - /ip firewall address-list add address=79.172.1.40 list=InetAdmin comment="external Onegin Convex"
          - /ip firewall address-list add address=195.162.6.0/23 list=InetAdmin comment="AS207496 MSK"
          - /ip firewall address-list add address=195.177.194.0/23 list=InetAdmin comment="AS207496 EKB"
          - /ip firewall address-list add address=("{{shopnet}}".".0/24") list=LAN
    - name: Set firewall filter input
      routeros_command:
        commands:
          - /ip firewall filter add action=accept chain=input comment="Accept input established connections" connection-state=established,related in-interface-list=WAN
          - /ip firewall filter add action=accept chain=forward comment="Accept established connections" connection-state=established,related
          - /ip firewall filter add action=drop chain=input comment="Drop input invalid connections" connection-state=invalid disabled=yes in-interface-list=WAN
          - /ip firewall filter add action=accept chain=input comment="Accept input ICMP" in-interface-list=WAN protocol=icmp
          - /ip firewall filter add action=accept chain=input comment="WinBox from Internet and LAN" dst-port=8291,22,80 protocol=tcp src-address-list=InetAdmin
          - /ip firewall filter add action=drop chain=input comment="Drop input all" connection-nat-state=!dstnat disabled=yes in-interface-list=WAN
          - /ip firewall filter add action=accept chain=forward comment=Ping protocol=icmp
          - /ip firewall filter add action=accept chain=forward comment=Accept_VPN_OUT out-interface-list=VPN
          - /ip firewall filter add action=accept chain=forward comment=Accept_VPN_IN in-interface-list=VPN
          - /ip firewall filter add action=accept chain=forward comment="Internet acces" out-interface-list=WAN src-address-list=LAN
          - /ip firewall filter add action=drop chain=forward comment="Drop all" connection-nat-state=!dstnat disabled=yes

    - name: Set OSPF
      routeros_command:
        commands:
          - /routing ospf instance set [ find default=yes ] router-id=("{{shopnet}}".".254")
          - /routing ospf interface add interface=LAN network-type=broadcast passive=yes
          - /routing ospf interface add authentication=md5 authentication-key=ehjdtym0 interface=FRN_MS network-type=point-to-point
          - /routing ospf interface add authentication=md5 authentication-key=ehjdtym0 interface=FRN_EK network-type=point-to-point
          - /routing ospf network add area=backbone network=("{{shopnet}}".".0/24")
          - /routing ospf network add area=backbone network=10.193.248.0/22
          - /routing ospf network add area=backbone network=10.192.248.0/22
    - name: Set log
      routeros_command:
        commands:
          - /system logging action set 1 disk-file-name=log
          - /system logging action set 3 remote=10.193.63.7 src-address=("{{shopnet}}".".254")
          - /system logging add action=remote topics=info,!ospf,!pptp
          - /system logging add action=remote topics=account,!web-proxy
          - /system logging add action=remote topics=error,!ospf,!pptp
          - /system logging add action=remote topics=warning,!ospf,!pptp
          - /system logging add action=remote topics=critical,!ospf,!pptp
    - name: Config RADIUS
      routeros_command:
        commands:
          - /user aaa set use-radius=yes
          - /radius add address=10.193.63.22 secret=rjhj,jxrf89 service=login
    - name: Set shop name
      routeros_command:
        commands:
          - /system identity set name=("{{shopfullname}}")
