- name: Remove address-list Promsvyazvank from BF
  hosts: GALA_MikroTik_BF
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: Remove address-list Promsvyazvank from BF
      routeros_command:
        commands:
          - /ip firewall address-list remove list="Promsvyazbank" address="91.233.63.46"
          - /ip firewall address-list remove list="Promsvyazbank" address="91.233.63.50"
          - /ip firewall address-list remove list="Promsvyazbank" address="91.233.63.105"
          - /ip firewall address-list remove list="Promsvyazbank" address="193.200.10.119"
          - /ip firewall address-list remove list="Promsvyazbank" address="193.200.10.120"
