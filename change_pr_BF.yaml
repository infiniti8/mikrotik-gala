- name: Change proxy
  hosts: GALA_MikroTik_FRN
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: Edit address list Proxy
      routeros_command:
        commands:
          - /ip firewall address-list remove [/ip firewall address-list find address=("46.22.56.21")]
          - /ip firewall address-list add address=("194.226.32.124") list=Proxy
