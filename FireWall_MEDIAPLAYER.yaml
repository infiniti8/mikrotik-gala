- name: firewall_Mediaplayer
  hosts: GALA_MikroTik_MPR
  gather_facts: false
  connection: network_cli
  tasks:
    - name: Addreslist_FIREWALL
      routeros_command:
        commands:
        - /ip firewall address-list add address=94.103.235.250 list=Mediaplayer
        - /ip firewall filter add action=accept chain=forward comment=Mediaplayer dst-address-list=Mediaplayer out-interface-list=WAN protocol=tcp place-before=[/ip firewall filter find chain=forward comment="WEB"]