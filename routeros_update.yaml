- name: update router os Firmware and hardware
  hosts: BF
  gather_facts: false
  connection: network_cli
  vars:
    version: "6.48.3"

  tasks:
    - name: START
      debug:
        msg: "-------START Update Procedure-------"
#Проверка версии прошивки FIRMWARE до обновления и запись значения в переменную system_firmware_print_before
    - name: check version firmware before update
      routeros_command:
        commands: /system resource print
      register: system_firmware_print_before
#Вывод номера версии прошивки FIRMWARE
    - name: Print firmware version
      debug: var=system_firmware_print_before.stdout_lines[0][1]
      when: version not in system_firmware_print_before.stdout_lines[0][1]
#Проверка версии прошивки HARDWARE до обновления и запись значения в переменную system_hardware_print_before
    - name: Check version hardware before update
      routeros_command:
        commands: /system routerboard print
      register: system_hardware_print_before
#Вывод номера версии прошивки HARDWARE
    - name: Print HARDWARE version
      debug: var=system_hardware_print_before.stdout_lines[0][7]
#Проверка установленного канала обновления, записывает вывод в переменную update_channel
    - name: Check update channel
      routeros_command:
        commands: /system package update print
      register: update_channel
#Вывод текущего установленного канала обновления вывод переменной update_channel.stdout_lines[0][0] первой строки
    - name: Print update_channel
      debug: var=update_channel.stdout_lines[0][0]
#Установка канала обновления на Stable с проверкой условия если установлен другой канал.
    - name: set update channel stable
      routeros_command:
        commands: /system package update set channel=stable
      register: print_channel_set
      when: "'channel: stable' not in update_channel.stdout_lines[0][0]"
#Вывод сообщения об ошибке установки канала если Stable отсутсвует в списке
    - name: print channel set
      debug:
        msg: "Stable channel not faund"
      when: 'syntax error' in print_channel_set.stdout[0]
#Установка канала обновления на current с проверкой условия если Stable не обнаружен в списке.
    - name: set update channel current if stable not faund
      routeros_command:
        commands: /system package update set channel=current
      when: "'syntax error' in print_channel_set.stdout[0]"
#Обновление FIRMWARE прошивки
    - name: update firmware
      routeros_command:
        commands: /system package update install 
      ignore_unreachable: yes
      when: version not in system_firmware_print_before.stdout_lines[0][1]
#Пауза ожидание перезагрузки микротика.
    - name: pause reboot
      pause:
        minutes: 8
      ignore_unreachable: yes
      when: version not in system_firmware_print_before.stdout_lines[0][1]
#Проверка версии прошивки FIRMWARE после обновления и запись значения в переменную system_firmware_print_after
    - name: check version firmware after update
      routeros_command:
        commands: /system resource print
      register: system_firmware_print_after
#Вывод номера версии прошивки FIRMWARE обновление произведено успешно
    - name: Print firmware version update sucsefull
      debug: var=system_firmware_print.stdout_lines[0][1]
      when: version in system_firmware_print_after.stdout_lines[0][1]
#Вывод сообщения об ошибке Обновление прошивки не произведено
    - name: Print firmware update version erorr
      debug:
        msg: "Update error"
      when: version not in system_firmware_print_after.stdout_lines[0][1]
#Обновление HARDWARE прошивки
    - name: update hardware
      routeros_command:
        commands: /system routerboard upgrade;:delay 60s;:execute {/system reboot;};
      ignore_unreachable: yes
      when: version not in system_hardware_print_before.stdout_lines[0][6]
#Пауза ожидание перезагрузки микротика.
    - name: pause reboot
      pause:
        minutes: 6
      ignore_unreachable: yes
      when: version not in system_hardware_print_before.stdout_lines[0][6]
#Проверка версии прошивки HARDWARE после обновления и запись значения в переменную system_hardware_print_after
    - name: Check version hardware after update
      routeros_command:
        commands: /system routerboard print
      register: system_hardware_print_after
#Вывод номера версии прошивки HARDWARE обновление произведено успешно
    - name: Print hardware version update sucsefull
      debug: var=system_hardware_print_after.stdout_lines[0][6]
      when: version in system_hardware_print_after.stdout_lines[0][6]
#Вывод сообщения об ошибке Обновление прошивки не произведено
    - name: Print hardware update version erorr
      debug:
        msg: "Update error"
      when: version not in system_hardware_print_after.stdout_lines[0][6]