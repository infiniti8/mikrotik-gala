- name: Remove Promsvyazbank addresses on fw MPR
  hosts: GALA_MikroTik_MPR
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: Remove Promsvyazbank addresses on fw MPR
      routeros_command:
        commands:
          - /ip firewall filter remove [find dst-address="91.223.63.46"]
          - /ip firewall filter remove [find dst-address="91.223.63.50"]
          - /ip firewall filter remove [find dst-address="91.223.63.105"]
          - /ip firewall filter remove [find dst-address="193.200.10.119"]
          - /ip firewall filter remove [find dst-address="193.200.10.120"]
