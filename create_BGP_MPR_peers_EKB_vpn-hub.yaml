- name: Create BGP peers on EKB VPN-hub
  hosts: newshop
  gather_facts: false
  connection: network_cli

  vars:
    ansible_command_timeout: 180

  tasks:
    - name: Create BGP peers
      routeros_command:
        commands:
          - /routing bgp peer add in-filter=vpn-bgp-in keepalive-time=30s name=MPR_198 out-filter=vpn-bgp-out remote-address=10.192.242.198 remote-as=65000 route-reflect=yes ttl=default
